name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Gate de cohérence des versions
        run: |
          bash scripts/verify-release-consistency.sh
      - name: Syntaxe PHP
        run: find plugin/community-race-calendar -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci
      - name: Audit, lint et tests
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm run lint
          npm test
      - name: Vérifier les assets distribués
        working-directory: frontend
        run: npm run build
      - name: Refuser des assets compilés obsolètes
        run: git diff --exit-code -- plugin/community-race-calendar/assets
